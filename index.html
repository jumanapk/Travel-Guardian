<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Guard — Safer Journeys. Happier Memories.</title>
  <meta name="description" content="Real-time tracking, instant alerts, and smart assistance for tourists and pilgrims. Stay connected, get help fast, and travel with confidence.">
  <meta name="theme-color" content="#075B50">

  <!-- Favicon with Shield Leaf motif -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23075B50'><path d='M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 4a3.5 3.5 0 0 1 3.5 3.5c0 2.5-3.5 6.5-3.5 6.5s-3.5-4-3.5-6.5A3.5 3.5 0 0 1 12 6z'/></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deepTeal: '#075B50',
            forestGreen: '#176B57',
            paleMint: '#EAF7F0',
            paleMintLight: '#F4FBF7',
            paleMintDark: '#D4EFE0',
            emergencyRed: '#F52935',
            softCharcoal: '#1A332D',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            handwriting: ['"Caveat"', 'cursive'],
          },
          boxShadow: {
            'subtle-teal': '0 10px 30px -5px rgba(7, 91, 80, 0.08)',
            'card-hover': '0 20px 40px -10px rgba(7, 91, 80, 0.14)',
            'teal-glow': '0 4px 20px -2px rgba(7, 91, 80, 0.35)',
          }
        }
      }
    };
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React 18 & ReactDOM & Babel Standalone for interactive components -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN for runtime fallback -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#FAFCFB] text-[#1A332D] min-h-screen selection:bg-[#EAF7F0] selection:text-[#075B50]">
  <!-- React Root Mount Point -->
  <div id="root"></div>

  <!-- Main React Application Script -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
